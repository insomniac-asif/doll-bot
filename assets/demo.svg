<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">
  <rect x="8" y="8" width="704" height="384" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>
  <circle cx="34" cy="38" r="6" fill="#ff5f56"/>
  <circle cx="54" cy="38" r="6" fill="#ffbd2e"/>
  <circle cx="74" cy="38" r="6" fill="#27c93f"/>
  <text x="100" y="43" fill="#8b949e" font-size="14">doll — words are not actions</text>
  <line x1="24" y1="60" x2="696" y2="60" stroke="#21262d" stroke-width="1"/>

  <text x="32" y="94" fill="#58a6ff" font-size="14">@user (mod):</text>
  <text x="150" y="94" fill="#c9d1d9" font-size="14">doll, lock #general and give @bob the admin role</text>

  <rect x="28" y="112" width="664" height="88" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="44" y="142" fill="#3fb950" font-size="13.5">✓  lock #general      → tool ran, result confirmed</text>
  <text x="44" y="172" fill="#f85149" font-size="13.5">✗  give @bob admin    → caller tier MOD &lt; ADMIN, refused (not executed)</text>

  <text x="32" y="240" fill="#d2a8ff" font-size="14">doll:</text>
  <text x="82" y="240" fill="#c9d1d9" font-size="14">locked #general ✓. i couldn't give @bob admin — that's ADMIN-only and</text>
  <text x="82" y="264" fill="#c9d1d9" font-size="14">you're MOD, so i didn't. not going to say i did.</text>

  <line x1="24" y1="298" x2="696" y2="298" stroke="#21262d" stroke-width="1"/>
  <text x="32" y="328" fill="#8b949e" font-size="13">permission tiers <tspan fill="#c9d1d9">(MOD / ADMIN / OWNER)</tspan> and confirm-gates on destructive tools are structural.</text>
  <text x="32" y="354" fill="#8b949e" font-size="13">the <tspan fill="#c9d1d9">only claim an action it actually took</tspan> rule is enforced in the system prompt.</text>
  <text x="32" y="380" fill="#6e7681" font-size="12">one Node process · many servers · 165 tools behind the gate.</text>
</svg>
